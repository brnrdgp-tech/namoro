<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 💜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bg-music" src="media/musica.mp3" autoplay loop></audio>
    <div class="container">
        <h1 class="top-text">Minha vida começou com você.</h1>
        <div class="carousel" id="carousel">
        </div>
        <div class="carousel-controls">
            <button id="prevBtn">&#10094;</button>
            <button id="nextBtn">&#10095;</button>
        </div>
        <div id="carousel-indicators"></div>
        <div class="bottom-text" id="bottomText">
            Estamos juntos há <span id="contador"></span> e espero estar contigo pra sempre.
        </div>
        <div class="imagem-texto" id="imagemTexto"></div>
        <p></p>
        <div><span id="longe"></span> estamos longe um do outro há <span id="contador2"></span></div>
        <button id="showAdminBtn">🔒</button>
        <div id="adminPanel" style="display: none;">
            <input type="datetime-local" name="" id="novoEncontro">
            <button id="atualizaEncontroBtn"> Atualizar </button>
            <button id="verDatasBtn"> Ver datas salvas</button>
        <pre id="jsonDatas" style="display:none;font-size:0.9em;background:#190032;padding:6px 12px;border-radius:8px;color:#c8a2ff"></pre>        </div>
        <button id="audioBtn" title="Tocar/Pausar música">🎵</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
